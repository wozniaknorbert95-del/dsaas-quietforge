<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Quote and Order Engine  configure, open price, checkout, order in the cockpit</title>
  <desc id="desc">Customer configures a governed catalog, sees the price, pays, and the order lands for the owner.</desc>
  <defs>
    <style>
      .bg { fill: #0e0c0a; }
      .box { fill: #15120e; stroke: #2a241c; stroke-width: 1.5; }
      .ok { fill: #e8a33d; fill-opacity: 0.12; stroke: #e8a33d; stroke-width: 1.5; }
      .t { fill: #e9e2d4; font-family: ui-monospace, Consolas, monospace; font-size: 14px; font-weight: 700; }
      .s { fill: #9a907e; font-family: ui-monospace, Consolas, monospace; font-size: 11px; }
    </style>
  </defs>
  <rect class="bg" width="1200" height="520"/>
  <text x="600" y="40" class="t" text-anchor="middle" font-size="18">Quote &amp; Order  a price in the same session</text>
  <text x="600" y="64" class="s" text-anchor="middle">governed catalog · open price · checkout · exception queue · cockpit</text>
  <rect class="box" x="36" y="120" width="210" height="88"/><text x="141" y="156" class="t" text-anchor="middle">Configure</text><text x="141" y="178" class="s" text-anchor="middle">only valid options</text>
  <rect class="box" x="266" y="120" width="210" height="88"/><text x="371" y="156" class="t" text-anchor="middle">Open price</text><text x="371" y="178" class="s" text-anchor="middle">before pay</text>
  <rect class="ok" x="496" y="120" width="210" height="88"/><text x="601" y="156" class="t" text-anchor="middle">Checkout</text><text x="601" y="178" class="s" text-anchor="middle">Mollie states</text>
  <rect class="box" x="726" y="120" width="210" height="88"/><text x="831" y="156" class="t" text-anchor="middle">Exception</text><text x="831" y="178" class="s" text-anchor="middle">you price the hard ones</text>
  <rect class="box" x="956" y="120" width="208" height="88"/><text x="1060" y="156" class="t" text-anchor="middle">Cockpit</text><text x="1060" y="178" class="s" text-anchor="middle">one order record</text>
  <rect class="box" x="160" y="260" width="400" height="72"/><text x="360" y="302" class="s" text-anchor="middle">Uploads attach to the order  not a later email</text>
  <rect class="box" x="640" y="260" width="400" height="72"/><text x="840" y="302" class="s" text-anchor="middle">Lab pattern: nine screens, seven decision stages</text>
  <text x="600" y="400" class="s" text-anchor="middle">Lab schematic. The system does not invent a price in the dark.</text>
  <text x="600" y="480" class="s" text-anchor="middle">Quietforge · quietforge.flexgrafik.nl</text>
</svg>
