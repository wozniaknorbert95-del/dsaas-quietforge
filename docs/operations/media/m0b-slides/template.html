<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --qf-bg: #050608;
      --qf-bg-raised: #0b0d12;
      --qf-bg-inset: #11141b;
      --qf-border: #252937;
      --qf-text: #e5e7ef;
      --qf-text-dim: #9ca3c7;
      --qf-text-faint: #9ca3af;
      --qf-accent: #e8a33d;
      --qf-ok: #6fae6f;
      --qf-mono: 'JetBrains Mono', ui-monospace, monospace;
    }
    html, body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: var(--qf-bg);
      color: var(--qf-text);
      font-family: var(--qf-mono);
    }
    .slide {
      width: 1080px;
      height: 1920px;
      padding: 72px 56px 80px;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .slide::before {
      content: '';
      position: absolute;
      top: 0; left: 56px; right: 56px;
      height: 1px;
      background: var(--qf-border);
    }
    .eyebrow {
      font-size: 22px;
      color: var(--qf-accent);
      letter-spacing: 0.04em;
      margin-bottom: 32px;
      text-transform: lowercase;
    }
    .headline {
      font-size: 44px;
      font-weight: 700;
      line-height: 1.25;
      margin-bottom: 40px;
      max-width: 920px;
    }
    .headline em {
      font-style: normal;
      color: var(--qf-accent);
    }
    .bullets {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 20px;
      flex: 1;
    }
    .bullets li {
      font-size: 26px;
      color: var(--qf-text-dim);
      padding-left: 28px;
      position: relative;
      line-height: 1.45;
    }
    .bullets li::before {
      content: '▸';
      position: absolute;
      left: 0;
      color: var(--qf-accent);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-top: auto;
      padding: 16px 24px;
      border: 1px solid var(--qf-border);
      background: var(--qf-bg-raised);
      font-size: 22px;
      letter-spacing: 0.06em;
    }
    .badge-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--qf-ok);
      box-shadow: 0 0 12px rgba(111, 174, 111, 0.5);
    }
    .screen-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      margin-top: 8px;
    }
    .screen-frame {
      flex: 1;
      border: 2px solid var(--qf-border);
      background: var(--qf-bg-inset);
      overflow: hidden;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      min-height: 980px;
      max-height: 1180px;
    }
    .screen-frame img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
      object-position: top center;
    }
    .callout {
      margin-top: 28px;
      padding: 24px 28px;
      border: 1px solid var(--qf-border);
      border-left: 3px solid var(--qf-accent);
      background: var(--qf-bg-raised);
    }
    .callout p {
      font-size: 24px;
      line-height: 1.5;
      color: var(--qf-text);
    }
    .callout span {
      color: var(--qf-accent);
    }
    .metrics {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-top: 24px;
    }
    .metrics-sub {
      margin-top: 28px;
      font-size: 22px;
      color: var(--qf-text-dim);
      line-height: 1.5;
      border-left: 3px solid var(--qf-accent);
      padding-left: 20px;
    }
    .metric {
      border: 1px solid var(--qf-border);
      background: var(--qf-bg-raised);
      padding: 28px 24px;
    }
    .metric-num {
      font-size: 40px;
      font-weight: 700;
      color: var(--qf-accent);
      margin-bottom: 8px;
    }
    .metric-label {
      font-size: 18px;
      color: var(--qf-text-dim);
      line-height: 1.4;
    }
    .footer-url {
      margin-top: auto;
      font-size: 22px;
      color: var(--qf-text-faint);
      letter-spacing: 0.02em;
    }
    .rule {
      height: 1px;
      background: var(--qf-border);
      margin: 32px 0;
    }
    .sub {
      font-size: 28px;
      color: var(--qf-text-dim);
      line-height: 1.5;
      max-width: 900px;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    const SCENES = {
      hook: {
        eyebrow: '// leak',
        headline: 'A serious lead should not wait <em>three days</em> for a basic quote.',
        bullets: [
          'The same questions by email',
          'Unclear budget',
          'No idea if the person is serious',
          'The owner involved too early',
        ],
      },
      pivot: {
        eyebrow: '// live proof',
        headline: 'I fixed this first in my own print business.',
        sub: 'Configure the package and see open pricing in the wizard. After they order, structured onboarding — not email threads.',
        badge: 'LIVE · FlexGrafik · zzpackage.flexgrafik.nl',
      },
      intro: {
        eyebrow: '// intro',
        screen: 'm0b-00-welcome.png',
        callout: 'Guided quote flow — <span>Stap 1 van 9</span> progress visible on every step.',
      },
      foundation: {
        eyebrow: '// foundation',
        screen: 'm0b-01-foundation.png',
        callout: 'Decision logic on every card — client self-qualifies in one session.',
      },
      vehicle: {
        eyebrow: '// vehicle',
        screen: 'm0b-02-vehicle-cart.png',
        callout: '<span>Price updates live</span> — sticky cart, no guessing.',
      },
      checkout: {
        eyebrow: '// checkout · mollie',
        screen: 'm0b-08-checkout.png',
        callout: '<span>Open price, commit to order</span> — Mollie from €199 minimum.',
      },
      bedanktChoice: {
        eyebrow: '// after order',
        screen: 'm0b-09-bedankt-choice.png',
        callout: 'Fill now or <span>secure link later</span> — no inbox chase for basics.',
      },
      briefForm: {
        eyebrow: '// briefing form',
        screen: 'm0b-10-brief-form.png',
        callout: 'Per-product sections — <span>logo, sizes, design</span> structured per SKU.',
      },
      metrics: {
        eyebrow: '// live metrics',
        headline: 'Running on FlexGrafik today — not a slide deck.',
        metricsSub: 'Plus a per-order briefing form that replaces the email chase for production details.',
        metrics: [
          { num: '161', label: 'SKUs in catalog' },
          { num: '9', label: 'UI screens' },
          { num: '7', label: 'Business decision stages' },
          { num: '€199', label: 'Mollie checkout minimum' },
        ],
      },
      cta: {
        eyebrow: '// next step',
        headline: 'If your quote process still runs on email ping-pong…',
        sub: 'The first step is not a new website. It is mapping where that process leaks time and money.',
        url: 'quietforge.flexgrafik.nl',
      },
    };

    const sceneId = new URLSearchParams(location.search).get('scene') || 'hook';
    const data = SCENES[sceneId];
    const root = document.getElementById('root');
    const screensBase = '../media/m0b-screens/';

    function renderHook(d) {
      return `<div class="slide">
        <div class="eyebrow">${d.eyebrow}</div>
        <h1 class="headline">${d.headline}</h1>
        <ul class="bullets">${d.bullets.map(b => `<li>${b}</li>`).join('')}</ul>
      </div>`;
    }

    function renderPivot(d) {
      return `<div class="slide">
        <div class="eyebrow">${d.eyebrow}</div>
        <h1 class="headline">${d.headline}</h1>
        <p class="sub">${d.sub}</p>
        <div class="badge"><span class="badge-dot"></span>${d.badge}</div>
      </div>`;
    }

    function renderScreen(d) {
      return `<div class="slide">
        <div class="eyebrow">${d.eyebrow}</div>
        <div class="screen-wrap">
          <div class="screen-frame">
            <img src="${screensBase}${d.screen}" alt="" />
          </div>
          <div class="callout"><p>${d.callout}</p></div>
        </div>
      </div>`;
    }

    function renderMetrics(d) {
      return `<div class="slide">
        <div class="eyebrow">${d.eyebrow}</div>
        <h1 class="headline">${d.headline}</h1>
        <div class="metrics">
          ${d.metrics.map(m => `<div class="metric"><div class="metric-num">${m.num}</div><div class="metric-label">${m.label}</div></div>`).join('')}
        </div>
        ${d.metricsSub ? `<p class="metrics-sub">${d.metricsSub}</p>` : ''}
      </div>`;
    }

    function renderCta(d) {
      return `<div class="slide">
        <div class="eyebrow">${d.eyebrow}</div>
        <h1 class="headline">${d.headline}</h1>
        <p class="sub">${d.sub}</p>
        <div class="rule"></div>
        <div class="footer-url">${d.url}</div>
      </div>`;
    }

    const renderers = {
      hook: renderHook,
      pivot: renderPivot,
      intro: renderScreen,
      foundation: renderScreen,
      vehicle: renderScreen,
      checkout: renderScreen,
      bedanktChoice: renderScreen,
      briefForm: renderScreen,
      metrics: renderMetrics,
      cta: renderCta,
    };

    root.innerHTML = renderers[sceneId](data);
  </script>
</body>
</html>
