<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Company Brain — sources in, structured knowledge, answers with citations</title>
  <desc id="desc">Documents and threads become a knowledge graph. Answers cite sources; conflicts are flagged; corrections wait for a human click.</desc>
  <defs>
    <style>
      .bg { fill: #0e0c0a; }
      .box { fill: #15120e; stroke: #2a241c; stroke-width: 1.5; }
      .warn { fill: #d98f4a; fill-opacity: 0.12; stroke: #d98f4a; stroke-width: 1.5; }
      .gate { fill: #e8a33d; fill-opacity: 0.12; stroke: #e8a33d; stroke-width: 1.5; }
      .t { fill: #e9e2d4; font-family: ui-monospace, Consolas, monospace; font-size: 14px; font-weight: 700; }
      .s { fill: #9a907e; font-family: ui-monospace, Consolas, monospace; font-size: 11px; }
    </style>
  </defs>
  <rect class="bg" width="1200" height="520"/>
  <text x="600" y="40" class="t" text-anchor="middle" font-size="18">Company Brain — one structured brain, answers with sources</text>
  <text x="600" y="64" class="s" text-anchor="middle">docs · inbox · heads · knowledge graph · citations · you approve corrections</text>
  <rect class="box" x="48" y="120" width="250" height="80"/><text x="173" y="154" class="t" text-anchor="middle">Collect sources</text><text x="173" y="176" class="s" text-anchor="middle">docs · threads · rules</text>
  <rect class="box" x="336" y="120" width="250" height="80"/><text x="461" y="154" class="t" text-anchor="middle">Structure knowledge</text><text x="461" y="176" class="s" text-anchor="middle">graph AI can use</text>
  <rect class="warn" x="624" y="120" width="250" height="80"/><text x="749" y="154" class="t" text-anchor="middle">Flag conflicts</text><text x="749" y="176" class="s" text-anchor="middle">two sources disagree</text>
  <rect class="gate" x="912" y="120" width="240" height="80"/><text x="1032" y="154" class="t" text-anchor="middle">You approve</text><text x="1032" y="176" class="s" text-anchor="middle">truth is your click</text>
  <rect class="box" x="200" y="260" width="360" height="72"/><text x="380" y="302" class="s" text-anchor="middle">Answers cite their source — or say “I don’t know”</text>
  <rect class="box" x="640" y="260" width="360" height="72"/><text x="820" y="302" class="s" text-anchor="middle">Grows with use — every correction feeds the loop</text>
  <text x="600" y="400" class="s" text-anchor="middle">Onboarding: weeks → days. New hires ask the brain before they interrupt you.</text>
  <text x="600" y="480" class="s" text-anchor="middle">Quietforge · quietforge.flexgrafik.nl</text>
</svg>
