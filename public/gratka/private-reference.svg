<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Private reference walkthrough</title>
  <desc id="desc">A private operational reference is available as a sanitized walkthrough, not as a public dashboard.</desc>
  <rect width="960" height="540" fill="#0e0c0a"/>
  <rect x="32" y="32" width="896" height="476" fill="#15120e" stroke="#3d3830" stroke-width="2"/>
  <text x="72" y="132" fill="#e8a33d" font-family="monospace" font-size="24">PRIVATE REFERENCE</text>
  <text x="72" y="198" fill="#e9e2d4" font-family="monospace" font-size="34" font-weight="700">Operational walkthrough available on request.</text>
  <text x="72" y="258" fill="#9a907e" font-family="monospace" font-size="20">Tenant data, credentials and internal hosts stay out of public assets.</text>
  <text x="72" y="430" fill="#9a907e" font-family="monospace" font-size="18">Quietforge · human approval · documented handover</text>
</svg>
